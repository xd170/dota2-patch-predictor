name: Dota 2 Patch Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [trigger-monitor]
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Отправить тестовое сообщение в Telegram прямо сейчас"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dota2-patch-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor and predictor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          FORCE_NOTIFY: ${{ github.event.inputs.force_notify || 'false' }}
        run: python -u monitor.py

      - name: Commit observations and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Dota 2 observations and state"
            git pull --rebase origin main
            git push
          fi
